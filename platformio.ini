[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; N8R8 module: 8 MB QIO flash / 8 MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type           = opi
board_build.partitions           = default_8MB.csv
board_upload.flash_size          = 8MB
board_upload.maximum_size        = 8388608

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Panel supply switch sense: SK2301AA1SHB P-channel high-side MOSFET on the
  ; EPD VCC, gate straight off GPIO17, so LOW turns it on.
  -DEPD_PWR_ACTIVE_HIGH=0

monitor_speed = 115200
upload_speed  = 460800

;upload_port = /dev/ttyACM0
; If the board has to be held in download mode by hand, set after_reset to
; no_reset so esptool leaves it in the bootloader. before_reset must stay at
; default_reset either way - esptool needs the handshake to sync, and with
; no_reset there it fails with "No serial data received".
board_upload.before_reset = default_reset
board_upload.after_reset  = hard_reset