[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lvgl/lvgl@^9.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; Pervasive Displays large EPD driver (add via GitHub)
    https://github.com/PervasiveDisplays/EPD_Driver_GU_large.git