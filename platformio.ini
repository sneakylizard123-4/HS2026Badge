[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
extra_scripts = pre:scripts/copy_assets_to_data.py
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  bitbank2/PNGdec

board_build.filesystem = littlefs

; N8R8 module: 8 MB QIO flash / 8 MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type           = opi
board_build.partitions           = default_8MB.csv
board_upload.flash_size          = 8MB
board_upload.maximum_size        = 8388608

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DAPP_FEATURE_WIFI=1
  -DAPP_FEATURE_BLE=1
  -DAPP_FEATURE_IMAGE=1
  ; Panel supply switch sense: SK2301AA1SHB P-channel high-side MOSFET on the
  ; EPD VCC, gate straight off GPIO17, so LOW turns it on.
  -DEPD_PWR_ACTIVE_HIGH=0

monitor_speed = 115200
upload_speed  = 460800

[env:wifi]
extra_scripts = pre:scripts/copy_assets_to_data.py
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  bitbank2/PNGdec
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type           = opi
board_build.partitions           = default_8MB.csv
board_upload.flash_size          = 8MB
board_upload.maximum_size        = 8388608
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DAPP_FEATURE_WIFI=1
  -DAPP_FEATURE_BLE=0
  -DAPP_FEATURE_IMAGE=0
  -DEPD_PWR_ACTIVE_HIGH=0
monitor_speed = 115200
upload_speed  = 460800
board_upload.before_reset = default_reset
board_upload.after_reset  = hard_reset

